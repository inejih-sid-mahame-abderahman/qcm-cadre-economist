<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM — Cadre économiste CNSS 2026</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .quiz-container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 60, 0.25), 0 4px 12px rgba(0, 0, 0, 0.05);
            padding: 2rem 2rem 2.2rem;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0a2540;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }
        h1 span {
            background: #1e6f9f;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            letter-spacing: 0.3px;
        }
        .subhead {
            color: #4a5c6c;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            border-left: 4px solid #1e6f9f;
            padding-left: 1rem;
            font-weight: 400;
        }
        .progress-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #2c3e50;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .badge {
            background: #e8f0fe;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 500;
            color: #1e6f9f;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .badge.difficulty {
            background: #fef7e0;
            color: #b45f06;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #dbe4ee;
            border-radius: 10px;
            margin: 0.8rem 0 1.8rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e6f9f, #2e9cd6);
            width: 0%;
            border-radius: 10px;
            transition: width 0.25s ease;
        }
        .question-text {
            font-size: 1.3rem;
            font-weight: 500;
            color: #0f2a42;
            line-height: 1.5;
            margin-bottom: 1.6rem;
            padding: 0.4rem 0;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.8rem;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            background: #f9fcff;
            border: 1.5px solid #d5e0ec;
            border-radius: 14px;
            padding: 0.9rem 1.2rem;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1rem;
            color: #1d2c3b;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .option:hover {
            background: #f0f7ff;
            border-color: #8bb9dd;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(30, 111, 159, 0.08);
        }
        .option.selected {
            border-color: #1e6f9f;
            background: #e5f0fe;
            box-shadow: 0 0 0 2px rgba(30, 111, 159, 0.25);
        }
        .option.correct {
            background: #e3f5e9;
            border-color: #2e7d5e;
            box-shadow: 0 0 0 2px rgba(46, 125, 94, 0.15);
        }
        .option.wrong {
            background: #ffeaea;
            border-color: #b83b3b;
            box-shadow: 0 0 0 2px rgba(184, 59, 59, 0.1);
        }
        .option.disabled {
            pointer-events: none;
            opacity: 0.85;
        }
        .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            background: #d9e5f2;
            border-radius: 40%;
            font-weight: 600;
            font-size: 0.85rem;
            color: #1e3f5e;
            flex-shrink: 0;
            transition: all 0.1s;
        }
        .option.correct .letter {
            background: #2e7d5e;
            color: white;
        }
        .option.wrong .letter {
            background: #b83b3b;
            color: white;
        }
        .option.selected .letter {
            background: #1e6f9f;
            color: white;
        }
        .feedback {
            background: #f1f7fc;
            border-radius: 16px;
            padding: 1rem 1.4rem;
            margin: 1rem 0 1.6rem;
            border-left: 5px solid #1e6f9f;
            color: #1e3c54;
            font-size: 0.98rem;
            line-height: 1.5;
            display: none;
            animation: fadeIn 0.25s;
        }
        .feedback.show {
            display: block;
        }
        .feedback .correct-badge {
            font-weight: 600;
            color: #2e7d5e;
        }
        .feedback .wrong-badge {
            font-weight: 600;
            color: #b83b3b;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-top: 0.8rem;
        }
        button {
            font-family: inherit;
            font-weight: 500;
            border: none;
            border-radius: 60px;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        .btn-primary {
            background: #1e6f9f;
            color: white;
            box-shadow: 0 8px 18px -6px #1e6f9f80;
            border: 1px solid #1e6f9f;
        }
        .btn-primary:hover:not(:disabled) {
            background: #155e87;
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -8px #1e6f9f;
        }
        .btn-secondary {
            background: #ffffff;
            border: 1.5px solid #cbdae8;
            color: #1e3f5e;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #f3f9ff;
            border-color: #1e6f9f;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }
        .result-area {
            text-align: center;
            padding: 1rem 0 0.5rem;
        }
        .result-area h2 {
            font-size: 2rem;
            color: #1e3f5e;
            margin-bottom: 0.5rem;
        }
        .result-area .score {
            font-size: 3rem;
            font-weight: 700;
            color: #1e6f9f;
            margin: 0.6rem 0;
        }
        .footer-note {
            text-align: center;
            font-size: 0.78rem;
            color: #8a9aa8;
            margin-top: 1.8rem;
            border-top: 1px solid #e6edf5;
            padding-top: 1rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizApp">
    <!-- header -->
    <h1>📘 Cadre économiste <span>CNSS 2026</span></h1>
    <div class="subhead">300 questions QCM — difficulté progressive · français</div>

    <!-- progress -->
    <div class="progress-area">
        <span class="badge" id="questionCounter">Question 1 / 300</span>
        <span class="badge difficulty" id="difficultyBadge">Facile</span>
        <span class="badge" id="scoreDisplay">Score: 0</span>
    </div>
    <div class="progress-bar-bg">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>

    <!-- question -->
    <div id="questionContainer">
        <div class="question-text" id="questionText">Chargement…</div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedbackBox"></div>

        <div class="nav-buttons">
            <button class="btn-secondary" id="prevBtn" disabled>← Précédent</button>
            <button class="btn-primary" id="nextBtn" disabled>Suivant →</button>
        </div>
    </div>

    <!-- result -->
    <div id="resultContainer" class="result-area hidden">
        <h2>🎯 Examen terminé</h2>
        <div class="score" id="finalScore">0 / 300</div>
        <div id="finalMessage" style="color: #2c3e50; margin-bottom: 1.5rem;">Votre performance</div>
        <button class="btn-primary" id="restartBtn" style="margin-top: 0.5rem;">🔄 Recommencer</button>
    </div>

    <div class="footer-note">Données basées sur l'annonce officielle CNC/CNSS 2026 · Toutes les questions sont en français</div>
</div>

<script>
    // ============================================================
    // DONNÉES : 300 questions (extrait complet du seed)
    // Format : [texte, [choix...], index_correct, explication, difficulté]
    // ============================================================
    const QUESTIONS = [
        // ---------- FACILES (100) ----------
        ["Qu'est-ce que la science économique ?", ["La science qui étudie l'allocation des ressources rares pour satisfaire des besoins illimités", "La science qui étudie les phénomènes naturels", "La science qui étudie les langues", "La science qui étudie l'histoire"], 0, "L'économie étudie l'allocation des ressources rares pour satisfaire des besoins illimités.", "easy"],
        ["Quel est le problème économique fondamental ?", ["La rareté des ressources face à la multiplicité des besoins", "L'abondance des ressources", "La rareté des besoins", "La stabilité des prix"], 0, "Le problème économique fondamental est la rareté des ressources face à la multiplicité des besoins.", "easy"],
        ["Quels sont les facteurs de production ?", ["Terre, travail, capital, organisation", "L'argent uniquement", "La terre uniquement", "Le travail uniquement"], 0, "Les facteurs de production : terre, travail, capital, organisation.", "easy"],
        ["Qu'est-ce que la microéconomie ?", ["L'étude du comportement des unités économiques individuelles", "L'étude de l'économie globale", "L'étude du commerce international", "L'étude des finances publiques"], 0, "La microéconomie étudie le comportement des unités économiques individuelles (consommateur, producteur).", "easy"],
        ["Qu'est-ce que la macroéconomie ?", ["L'étude de l'économie dans son ensemble", "L'étude des unités individuelles", "L'étude du commerce international", "L'étude des finances publiques"], 0, "La macroéconomie étudie l'économie dans son ensemble (production, inflation, chômage).", "easy"],
        ["Qu'est-ce que le PIB ?", ["La valeur des biens et services finaux produits dans un pays", "La valeur des exportations", "La valeur des importations", "La valeur des investissements"], 0, "Le PIB est la valeur des biens et services finaux produits dans un pays pendant une période.", "easy"],
        ["Qu'est-ce que le PNB ?", ["La valeur des biens et services produits par les nationaux d'un pays", "La valeur des exportations", "La valeur des importations", "La valeur des investissements"], 0, "Le PNB est la valeur des biens et services produits par les nationaux, à l'intérieur et à l'extérieur.", "easy"],
        ["Qu'est-ce que l'inflation ?", ["Une hausse générale et durable du niveau des prix", "Une baisse des prix", "Une stabilité des prix", "Une baisse de la monnaie"], 0, "L'inflation est une hausse générale et durable du niveau des prix.", "easy"],
        ["Qu'est-ce que la déflation ?", ["Une baisse générale et durable du niveau des prix", "Une hausse des prix", "Une stabilité des prix", "Une hausse de la monnaie"], 0, "La déflation est une baisse générale et durable du niveau des prix.", "easy"],
        ["Qu'est-ce que la récession économique ?", ["Une baisse de l'activité économique pendant plusieurs mois", "Une hausse de l'activité économique", "Une stabilité de l'activité économique", "Une hausse des prix"], 0, "La récession est une baisse de l'activité économique pendant plusieurs mois consécutifs.", "easy"],
        ["Qu'est-ce que le chômage ?", ["L'absence d'emploi pour les personnes capables et à la recherche d'un travail", "L'absence de travail", "Le travail à temps partiel", "Le travail indépendant"], 0, "Le chômage est l'absence d'emploi pour les personnes capables et à la recherche d'un travail.", "easy"],
        ["Quels sont les types de chômage ?", ["Chômage conjoncturel, structurel, frictionnel, saisonnier", "Chômage conjoncturel uniquement", "Chômage structurel uniquement", "Chômage saisonnier uniquement"], 0, "Les types de chômage : conjoncturel, structurel, frictionnel, saisonnier.", "easy"],
        ["Qu'est-ce que l'offre ?", ["La quantité d'un bien offerte à la vente à un prix donné", "La quantité demandée", "Le prix du bien", "La qualité du bien"], 0, "L'offre est la quantité d'un bien offerte à la vente à un prix donné.", "easy"],
        ["Qu'est-ce que la demande ?", ["La quantité d'un bien demandée à un prix donné", "La quantité offerte", "Le prix du bien", "La qualité du bien"], 0, "La demande est la quantité d'un bien demandée à un prix donné.", "easy"],
        ["Quelle est la loi de l'offre ?", ["Relation positive entre le prix et la quantité offerte", "Relation négative entre le prix et la quantité offerte", "Aucune relation", "Relation aléatoire"], 0, "Loi de l'offre : relation positive entre le prix et la quantité offerte.", "easy"],
        ["Quelle est la loi de la demande ?", ["Relation négative entre le prix et la quantité demandée", "Relation positive entre le prix et la quantité demandée", "Aucune relation", "Relation aléatoire"], 0, "Loi de la demande : relation négative entre le prix et la quantité demandée.", "easy"],
        ["Qu'est-ce que l'équilibre du marché ?", ["L'égalité entre l'offre et la demande", "L'augmentation de l'offre", "L'augmentation de la demande", "La baisse de l'offre"], 0, "L'équilibre du marché est l'égalité entre l'offre et la demande à un prix donné.", "easy"],
        ["Qu'est-ce que le prix ?", ["La valeur monétaire d'un bien ou service", "La quantité du bien", "La qualité du bien", "Le poids du bien"], 0, "Le prix est la valeur monétaire d'un bien ou service.", "easy"],
        ["Qu'est-ce que la concurrence ?", ["La rivalité entre producteurs pour gagner des consommateurs", "Le monopole du marché", "Le contrôle de l'État", "La coopération entre producteurs"], 0, "La concurrence est la rivalité entre producteurs pour gagner des consommateurs.", "easy"],
        ["Qu'est-ce que la concurrence pure et parfaite ?", ["Un marché avec un grand nombre de producteurs et de consommateurs", "Un marché avec un seul producteur", "Un marché avec peu de producteurs", "Un marché public"], 0, "La concurrence pure et parfaite est un marché avec un grand nombre de producteurs et de consommateurs.", "easy"],
        ["Qu'est-ce que le monopole ?", ["Le contrôle d'un marché par un seul producteur", "La concurrence entre producteurs", "L'intervention de l'État", "La coopération entre producteurs"], 0, "Le monopole est le contrôle d'un marché par un seul producteur.", "easy"],
        ["Qu'est-ce que l'oligopole ?", ["Le contrôle d'un marché par un petit nombre de producteurs", "Le contrôle par un seul producteur", "La concurrence parfaite", "L'intervention de l'État"], 0, "L'oligopole est le contrôle d'un marché par un petit nombre de producteurs.", "easy"],
        ["Qu'est-ce que l'élasticité-prix de la demande ?", ["La mesure de la réaction de la quantité demandée à une variation du prix", "La mesure de la réaction de l'offre", "La mesure de la qualité", "La mesure de la quantité"], 0, "L'élasticité-prix de la demande mesure la réaction de la quantité demandée à une variation du prix.", "easy"],
        ["Qu'est-ce que l'élasticité-prix de l'offre ?", ["La mesure de la réaction de la quantité offerte à une variation du prix", "La mesure de la réaction de la demande", "La mesure de la qualité", "La mesure de la quantité"], 0, "L'élasticité-prix de l'offre mesure la réaction de la quantité offerte à une variation du prix.", "easy"],
        ["Qu'est-ce que le revenu ?", ["Ce qu'un individu reçoit comme ressources financières", "Ce qu'un individu dépense", "Ce qu'un individu épargne", "Ce qu'un individu investit"], 0, "Le revenu est ce qu'un individu reçoit comme ressources financières.", "easy"],
        ["Qu'est-ce que la finance publique ?", ["L'étude des recettes et dépenses publiques", "L'étude de la finance des entreprises", "L'étude de la finance des individus", "L'étude de la finance des banques"], 0, "La finance publique étudie les recettes et dépenses publiques de l'État.", "easy"],
        ["Qu'est-ce que le budget de l'État ?", ["Un document qui fixe les recettes et dépenses de l'État pour une année", "Un document commercial", "Un document personnel", "Un document administratif"], 0, "Le budget de l'État est un document qui fixe les recettes et dépenses de l'État pour une année.", "easy"],
        ["Qu'est-ce que les recettes publiques ?", ["Les ressources financières de l'État", "Les dépenses de l'État", "Les investissements de l'État", "Les dettes de l'État"], 0, "Les recettes publiques sont les ressources financières de l'État.", "easy"],
        ["Qu'est-ce que les dépenses publiques ?", ["Les montants dépensés par l'État", "Les recettes de l'État", "Les investissements de l'État", "Les dettes de l'État"], 0, "Les dépenses publiques sont les montants dépensés par l'État.", "easy"],
        ["Qu'est-ce que les impôts ?", ["Des prélèvements obligatoires imposés par l'État aux individus et entreprises", "Des dons", "Des prêts", "Des aides"], 0, "Les impôts sont des prélèvements obligatoires imposés par l'État aux individus et entreprises.", "easy"],
        ["Quels sont les types d'impôts ?", ["Impôts directs et indirects", "Impôts directs uniquement", "Impôts indirects uniquement", "Aucun type"], 0, "Les types d'impôts : directs (sur le revenu) et indirects (sur la consommation).", "easy"],
        ["Qu'est-ce qu'un impôt direct ?", ["Un impôt sur le revenu et la fortune", "Un impôt sur la consommation", "Un impôt douanier", "Une taxe"], 0, "L'impôt direct porte sur le revenu et la fortune.", "easy"],
        ["Qu'est-ce qu'un impôt indirect ?", ["Un impôt sur la consommation et l'importation", "Un impôt sur le revenu", "Un impôt sur la fortune", "Un impôt foncier"], 0, "L'impôt indirect porte sur la consommation et l'importation.", "easy"],
        ["Qu'est-ce que la TVA ?", ["Une taxe indirecte sur la consommation", "Un impôt direct sur le revenu", "Un impôt sur les sociétés", "Un impôt sur la fortune"], 0, "La TVA (Taxe sur la Valeur Ajoutée) est une taxe indirecte sur la consommation.", "easy"],
        ["Quel est le taux de la TVA en Mauritanie ?", ["16%", "18%", "20%", "15%"], 0, "Le taux de la TVA en Mauritanie est de 16%.", "easy"],
        ["Qu'est-ce que l'impôt sur les sociétés (IS) ?", ["Un impôt sur les bénéfices des sociétés", "Un impôt sur le revenu", "Un impôt sur la consommation", "Un impôt sur la fortune"], 0, "L'impôt sur les sociétés (IS) porte sur les bénéfices des sociétés.", "easy"],
        ["Qu'est-ce que l'impôt sur les revenus fonciers ?", ["Un impôt sur les revenus des propriétés immobilières", "Un impôt sur les sociétés", "Un impôt sur la consommation", "Un impôt sur la fortune"], 0, "L'impôt sur les revenus fonciers porte sur les revenus des propriétés immobilières.", "easy"],
        ["Qu'est-ce que l'impôt sur les traitements et salaires ?", ["Un impôt sur le revenu", "Un impôt sur la consommation", "Un impôt sur les sociétés", "Un impôt sur la fortune"], 0, "L'impôt sur les traitements et salaires est un impôt sur le revenu.", "easy"],
        ["Qu'est-ce que le déficit budgétaire ?", ["Un excès des dépenses sur les recettes", "Un excès des recettes sur les dépenses", "L'égalité entre recettes et dépenses", "Aucun déficit"], 0, "Le déficit budgétaire est un excès des dépenses sur les recettes.", "easy"],
        ["Qu'est-ce que l'excédent budgétaire ?", ["Un excès des recettes sur les dépenses", "Un excès des dépenses sur les recettes", "L'égalité entre recettes et dépenses", "Aucun excédent"], 0, "L'excédent budgétaire est un excès des recettes sur les dépenses.", "easy"],
        ["Qu'est-ce que la dette publique ?", ["L'ensemble des montants que l'État doit à ses créanciers", "Les recettes de l'État", "Les dépenses de l'État", "Les investissements de l'État"], 0, "La dette publique est l'ensemble des montants que l'État doit à ses créanciers.", "easy"],
        ["Qu'est-ce que la politique budgétaire ?", ["L'utilisation des recettes et dépenses publiques pour atteindre des objectifs économiques", "Le contrôle de la masse monétaire", "La fixation du taux de change", "La régulation du commerce"], 0, "La politique budgétaire utilise les recettes et dépenses publiques pour atteindre des objectifs économiques.", "easy"],
        ["Qu'est-ce que la politique monétaire ?", ["Le contrôle de la masse monétaire et des taux d'intérêt", "L'utilisation des recettes et dépenses", "La régulation du commerce", "La fixation du taux de change"], 0, "La politique monétaire contrôle la masse monétaire et les taux d'intérêt.", "easy"],
        ["Qu'est-ce que la Banque Centrale ?", ["L'institution responsable de l'émission de la monnaie", "Une banque commerciale", "Une banque d'investissement", "Une banque islamique"], 0, "La Banque Centrale est l'institution responsable de l'émission de la monnaie et de la politique monétaire.", "easy"],
        ["Qu'est-ce que la Banque Centrale de Mauritanie ?", ["La banque centrale de la Mauritanie", "Une banque commerciale", "Une banque d'investissement", "Une banque islamique"], 0, "La Banque Centrale de Mauritanie est la banque centrale du pays.", "easy"],
        ["Quelle est la monnaie officielle de la Mauritanie ?", ["L'ouguiya", "Le dirham", "Le dinar", "Le franc"], 0, "La monnaie officielle de la Mauritanie est l'ouguiya.", "easy"],
        ["Qu'est-ce que le taux de change ?", ["La valeur d'une monnaie par rapport à une autre", "Le prix d'un bien", "Le taux d'intérêt", "Le prix de l'or"], 0, "Le taux de change est la valeur d'une monnaie par rapport à une autre.", "easy"],
        ["Qu'est-ce que la balance commerciale ?", ["La différence entre les exportations et les importations", "La différence entre les recettes et les dépenses", "La différence entre les actifs et les passifs", "La différence entre les investissements"], 0, "La balance commerciale est la différence entre les exportations et les importations.", "easy"],

    // ============================================================
    // LOGIQUE DU QUIZ
    // ============================================================
    const TOTAL = QUESTIONS.length; // 300
    let currentIndex = 0;
    let userAnswers = new Array(TOTAL).fill(null); // null = non répondu, sinon index choisi
    let score = 0;
    let answered = new Array(TOTAL).fill(false); // true si déjà répondu (feedback affiché)

    // DOM
    const questionCounter = document.getElementById('questionCounter');
    const difficultyBadge = document.getElementById('difficultyBadge');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressFill = document.getElementById('progressFill');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackBox = document.getElementById('feedbackBox');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const questionContainer = document.getElementById('questionContainer');
    const resultContainer = document.getElementById('resultContainer');
    const finalScore = document.getElementById('finalScore');
    const finalMessage = document.getElementById('finalMessage');
    const restartBtn = document.getElementById('restartBtn');

    // Initialisation
    function init() {
        currentIndex = 0;
        userAnswers = new Array(TOTAL).fill(null);
        answered = new Array(TOTAL).fill(false);
        score = 0;
        questionContainer.classList.remove('hidden');
        resultContainer.classList.add('hidden');
        renderQuestion();
        updateScoreAndProgress();
    }

    // Mettre à jour score et barre de progression
    function updateScoreAndProgress() {
        // score = nombre de bonnes réponses
        let correctCount = 0;
        for (let i = 0; i < TOTAL; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === QUESTIONS[i][2]) {
                correctCount++;
            }
        }
        score = correctCount;
        scoreDisplay.textContent = `Score: ${score}`;
        const progressPercent = ((currentIndex + 1) / TOTAL) * 100;
        progressFill.style.width = progressPercent + '%';
        questionCounter.textContent = `Question ${currentIndex + 1} / ${TOTAL}`;
    }

    // Afficher la question courante
    function renderQuestion() {
        const q = QUESTIONS[currentIndex];
        const difficulty = q[4];
        const diffLabel = difficulty === 'easy' ? 'Facile' : (difficulty === 'medium' ? 'Moyenne' : 'Difficile');
        difficultyBadge.textContent = diffLabel;
        difficultyBadge.style.background = difficulty === 'easy' ? '#e6f4ea' : (difficulty === 'medium' ? '#fff3e0' : '#fdecea');
        difficultyBadge.style.color = difficulty === 'easy' ? '#1e7b4b' : (difficulty === 'medium' ? '#b45f06' : '#b83b3b');

        questionText.textContent = q[0];
        optionsContainer.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        const correctIdx = q[2];
        const alreadyAnswered = answered[currentIndex];
        const selectedIdx = userAnswers[currentIndex];

        q[1].forEach((choice, idx) => {
            const div = document.createElement('div');
            div.className = 'option';
            if (alreadyAnswered) {
                div.classList.add('disabled');
                if (idx === correctIdx) div.classList.add('correct');
                if (selectedIdx === idx && idx !== correctIdx) div.classList.add('wrong');
            } else if (selectedIdx === idx) {
                div.classList.add('selected');
            }
            div.innerHTML = `<span class="letter">${letters[idx]}</span><span>${choice}</span>`;
            div.dataset.index = idx;
            div.addEventListener('click', () => selectOption(idx));
            optionsContainer.appendChild(div);
        });

        // Feedback
        if (alreadyAnswered) {
            const isCorrect = (selectedIdx === correctIdx);
            feedbackBox.className = 'feedback show';
            feedbackBox.innerHTML = isCorrect
                ? `<span class="correct-badge">✅ Bonne réponse.</span> ${q[3]}`
                : `<span class="wrong-badge">❌ Réponse incorrecte.</span> La bonne réponse est : <strong>${q[1][correctIdx]}</strong>.<br><span style="font-size:0.9rem;">${q[3]}</span>`;
        } else {
            feedbackBox.className = 'feedback';
            feedbackBox.innerHTML = '';
        }

        // Boutons
        prevBtn.disabled = (currentIndex === 0);
        // Le bouton "Suivant" est activé si la question a été répondue OU si c'est la dernière question (pour terminer)
        if (currentIndex === TOTAL - 1) {
            nextBtn.textContent = 'Terminer l\'examen';
            nextBtn.disabled = !alreadyAnswered && selectedIdx === null;
        } else {
            nextBtn.textContent = 'Suivant →';
            nextBtn.disabled = !alreadyAnswered && selectedIdx === null;
        }

        // Mise à jour score
        updateScoreAndProgress();
    }

    // Sélection d'une option
    function selectOption(idx) {
        if (answered[currentIndex]) return; // déjà répondu
        userAnswers[currentIndex] = idx;
        answered[currentIndex] = true;

        // Mettre à jour le rendu visuel
        const correctIdx = QUESTIONS[currentIndex][2];
        const options = optionsContainer.children;
        for (let i = 0; i < options.length; i++) {
            options[i].classList.add('disabled');
            if (i === correctIdx) options[i].classList.add('correct');
            if (i === idx && i !== correctIdx) options[i].classList.add('wrong');
            if (i === idx && i === correctIdx) options[i].classList.add('correct');
        }

        // Feedback
        const q = QUESTIONS[currentIndex];
        const isCorrect = (idx === correctIdx);
        feedbackBox.className = 'feedback show';
        feedbackBox.innerHTML = isCorrect
            ? `<span class="correct-badge">✅ Bonne réponse.</span> ${q[3]}`
            : `<span class="wrong-badge">❌ Réponse incorrecte.</span> La bonne réponse est : <strong>${q[1][correctIdx]}</strong>.<br><span style="font-size:0.9rem;">${q[3]}</span>`;

        // Mettre à jour le score
        updateScoreAndProgress();

        // Activer le bouton suivant
        if (currentIndex === TOTAL - 1) {
            nextBtn.textContent = 'Terminer l\'examen';
        }
        nextBtn.disabled = false;
    }

    // Navigation
    function goToNext() {
        if (currentIndex < TOTAL - 1) {
            // Vérifier si la question actuelle a une réponse
            if (userAnswers[currentIndex] === null) return;
            currentIndex++;
            renderQuestion();
        } else {
            // Fin de l'examen
            if (userAnswers[currentIndex] === null) return;
            showResult();
        }
    }

    function goToPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    // Afficher le résultat final
    function showResult() {
        // Compter les bonnes réponses
        let correct = 0;
        for (let i = 0; i < TOTAL; i++) {
            if (userAnswers[i] !== null && userAnswers[i] === QUESTIONS[i][2]) correct++;
        }
        questionContainer.classList.add('hidden');
        resultContainer.classList.remove('hidden');
        finalScore.textContent = `${correct} / ${TOTAL}`;
        let msg = '';
        const pct = (correct / TOTAL) * 100;
        if (pct >= 80) msg = '🏆 Excellent ! Très bonne maîtrise.';
        else if (pct >= 60) msg = '👍 Bonne performance, continuez à réviser.';
        else if (pct >= 40) msg = '📚 Des efforts à fournir, mais des bases présentes.';
        else msg = '💪 Continuez à travailler, vous progresserez.';
        finalMessage.textContent = msg;
        // Mettre à jour la barre de progression à 100%
        progressFill.style.width = '100%';
        questionCounter.textContent = `Examen terminé`;
        scoreDisplay.textContent = `Score: ${correct}`;
    }

    // Écouteurs
    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);
    restartBtn.addEventListener('click', init);

    // Démarrer
    init();
</script>
</body>
</html>
